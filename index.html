<!DOCTYPE html>
<!--
  ============================================================
  刁雅琪的个人简历（RST 竞赛训练营入营作品 · 必做题）
  ------------------------------------------------------------
  工程结构说明：
  · 单文件自包含（内联 CSS / 原生 JS，零依赖零构建，双击即可运行）
  · 数据与视图分离：所有简历内容集中在底部 script 标签开头的 resume 对象，
    修改字段即改页面，无需碰任何渲染逻辑
  · 渲染层按区块拆分为独立 IIFE（Hero / 轮播 / 亮点 / 经历 / 项目 /
    技能 / 教育证书 / 兴趣爱好），互不依赖，便于定位与维护
  主题与动效：
  · 背景：深空流星动态背景（夜晚＝纯黑 + 白色流星；白天＝灰底 + 深蓝灰流星）
  · 交互：深浅色切换 / 打印导出 PDF / 滚动入场 / 关键词通栏无缝轮播 / 鼠标流星
  · 无障碍与降级：prefers-reduced-motion、触屏隐藏光效、打印样式均已处理
  图片接入（加分项 · 排版美观）：
  · 个人照片：把照片放入本目录，并在 resume.avatar 填 "文件名.jpg" 即自动显示
  · 证书照片：certs[].img 填 "文件名.jpg" 即自动显示；爱好封面 hobbies[].img 同理
  ============================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="刁雅琪的个人在线简历 — 会计学 × 数据分析 × AI 应用">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="刁雅琪的个人简历">
<meta property="og:description" content="会计学 × 数据分析 × AI 应用 · 深空流星动态简历">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌠</text></svg>">
<title>刁雅琪的个人简历</title>
<style>
:root{
  --primary:#8ab8e8; --primary-strong:#a8cdf0; --primary-soft:rgba(138,184,232,.14);
  --accent:#b9e1e9; --accent-soft:rgba(185,225,233,.10);
  --hi:#f0c674; --hi-soft:rgba(240,198,116,.14); --hi-grad:linear-gradient(120deg,#f6dc95,#e2b45a);
  --bg:#070b14; --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.09);
  --text:#eef2f8; --text-2:#9db0c4; --border:rgba(255,255,255,.12);
  --shadow:0 2px 8px rgba(0,0,0,.30),0 12px 32px rgba(0,0,0,.42);
  --shadow-hover:0 6px 16px rgba(0,0,0,.46),0 20px 48px rgba(0,0,0,.58);
  --radius:18px; --nav-h:64px;
  --glow:rgba(158,202,230,.16);
}
html[data-theme="dark"]{
  --primary:#9ecae6; --primary-strong:#cdeaf6; --primary-soft:rgba(158,202,230,.12);
  --accent:#86d8e8; --accent-soft:rgba(134,216,232,.10);
  --ring-glow:rgba(158,202,230,.42);
  --bg:#000000; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.09);
  --text:#f1f5f9; --text-2:#9fb0c4; --border:rgba(255,255,255,.12);
  --shadow:0 2px 8px rgba(0,0,0,.30),0 12px 32px rgba(0,0,0,.42);
  --shadow-hover:0 6px 16px rgba(0,0,0,.46),0 20px 48px rgba(0,0,0,.58);
  --glow:rgba(158,202,230,.16);
}
html[data-theme="light"]{
  --primary:#2d6fa8; --primary-strong:#3d84bd; --primary-soft:rgba(45,111,168,.10);
  --accent:#3d84bd; --accent-soft:rgba(61,132,189,.10);
  --hi:#b07a26; --hi-soft:rgba(176,122,38,.12); --hi-grad:linear-gradient(120deg,#c99240,#8f6218);
  --bg:#eef0f4; --surface:rgba(255,255,255,.55); --surface-2:rgba(255,255,255,.70);
  --text:#26303c; --text-2:#56657a; --border:rgba(40,60,80,.14);
  --shadow:0 2px 8px rgba(40,60,85,.06),0 12px 30px rgba(40,60,85,.09);
  --shadow-hover:0 6px 16px rgba(40,60,85,.10),0 20px 44px rgba(40,60,85,.14);
  --glow:rgba(45,111,168,.14);
  --ring-glow:rgba(45,111,168,.30);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--text);line-height:1.7;
  transition:background .3s,color .3s;
  background:#000000;
  background-attachment:fixed;
}
html[data-theme="light"] body{
  background:
    radial-gradient(ellipse 70% 55% at 15% 0%, rgba(255,255,255,.65), transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 100%, rgba(255,255,255,.45), transparent 60%),
    linear-gradient(180deg,#eef0f4 0%,#e1e5eb 100%);
}

/* ---------- 流星背景层 ---------- */
.meteor-bg{
  position:fixed;inset:0;z-index:-1;
  overflow:hidden;background:#000000;
  pointer-events:none;display:block;
  /* 流星配色：默认深色主题（白色流星） */
  --tail-a:rgba(255,255,255,.35);
  --tail-b:rgba(255,255,255,.95);
  --tail-c:#ffffff;
  --head-c:rgba(255,255,255,.98);
  --head-glow1:rgba(255,255,255,.9);
  --head-glow2:rgba(255,255,255,.35);
}
html[data-theme="light"] .meteor-bg{
  background:linear-gradient(180deg,#eef0f4 0%,#e1e5eb 100%);
  /* 浅色主题：灰色打底，流星换深蓝灰保证可见 */
  --tail-a:rgba(62,76,94,.30);
  --tail-b:rgba(62,76,94,.88);
  --tail-c:#3e4c5e;
  --head-c:rgba(62,76,94,.97);
  --head-glow1:rgba(62,76,94,.8);
  --head-glow2:rgba(62,76,94,.32);
}
.meteor-bg .meteor{
  position:absolute;left:var(--start-x);top:-120px;opacity:0;
  pointer-events:none;will-change:transform,opacity;
  animation:meteor-fall var(--duration) var(--delay) linear infinite;
}
.meteor-bg .visual{
  position:absolute;width:0;height:0;
  transform:rotate(var(--angle));transform-origin:0 0;
}
.meteor-bg .tail{
  position:absolute;left:calc(-0.5 * var(--thickness));top:calc(-1 * var(--len));
  width:var(--thickness);height:var(--len);border-radius:999px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0) 35%,
    var(--tail-a) 68%,
    var(--tail-b) 94%,
    var(--tail-c) 100%
  );
}
.meteor-bg .head{
  position:absolute;left:0;top:0;
  width:var(--head-size);height:var(--head-size);
  margin-left:calc(-0.5 * var(--head-size));
  margin-top: calc(-0.5 * var(--head-size));
  border-radius:50%;
  background:var(--head-c);
  box-shadow:0 0 4px 1px var(--head-glow1),0 0 10px 3px var(--head-glow2);
}
@keyframes meteor-fall{
  0%   {transform:translate3d(0,0,0);opacity:0}
  6%   {opacity:var(--peak-opacity)}
  92%  {opacity:var(--peak-opacity)}
  100% {transform:translate3d(0,calc(100vh + 180px),0);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .meteor-bg .meteor{animation:none;opacity:0.12}
}
::selection{background:var(--primary);color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ---------- 导航栏 ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1080px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;gap:20px}
.nav-name{font-weight:700;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.nav-name em{font-style:normal;color:var(--primary)}
.nav-links{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--text-2);white-space:nowrap;transition:color .2s,background .2s}
.nav-links a:hover,.nav-links a.active{color:var(--primary);background:var(--primary-soft)}
.nav-actions{display:flex;gap:8px;align-items:center}
/* 移动端汉堡菜单按钮（≤820px 显示） */
.menu-btn{display:none}
.menu-btn svg{width:20px;height:20px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  transition:all .2s;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}

/* ---------- 通用区块 ---------- */
section{padding:72px 0}
.sec-head{margin-bottom:36px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.sec-titles{display:flex;flex-direction:column;min-width:0}
.sec-tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:2px;color:var(--primary);text-transform:uppercase;margin-bottom:6px}
.sec-title-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sec-title{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:.5px}
/* 标题右侧「横线 + 语录」并排一行，紧挨大标题 */
.sec-sub{display:flex;align-items:center;gap:9px}
.sec-rule{width:36px;height:4px;border-radius:3px;flex:none;background:linear-gradient(90deg,var(--primary),var(--accent));box-shadow:0 0 10px color-mix(in srgb,var(--accent) 45%,transparent)}
.sec-quote{font-size:15px;font-weight:800;letter-spacing:2px;display:inline-flex;align-items:center;white-space:nowrap;filter:drop-shadow(0 2px 10px color-mix(in srgb,var(--accent) 45%,transparent))}
/* 语录逐字跳动（字节跳动式循环）+ 渐变流光，更惊艳 */
.q-ch{display:inline-block;animation:qbounce 1s ease-in-out infinite;will-change:transform;
  background:linear-gradient(100deg,var(--primary),var(--accent) 55%,var(--primary));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
@keyframes qbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.q-ch{animation:none}}
@media print{.q-ch{animation:none!important;transform:none!important;-webkit-text-fill-color:var(--accent);color:var(--accent);filter:none}
  .sec-sub{filter:none}}

/* ---------- 卡片与鼠标光效 ---------- */
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;overflow:hidden;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%);
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.card:hover::before{opacity:1}
/* 经历模块同款跟随光晕 */
.exp-group::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%);
}
.exp-group:hover::before{opacity:1}
html[data-theme="dark"] .avatar-ring{
  box-shadow:
    0 0 0 1px rgba(255,255,255,.18),
    0 0 30px 2px rgba(158,202,230,.35),
    0 12px 32px rgba(0,0,0,.45);
}
html[data-theme="dark"] .hobby-cover img{filter:brightness(.85)}

/* 浅色主题：占位格 / 证书 / 爱好封面换成浅灰蓝渐变，与灰色打底协调 */
html[data-theme="light"] .avatar-inner .avatar-placeholder{
  background:linear-gradient(135deg,#dfe4ea 0%,#c8d2dd 100%);
  color:rgba(62,76,94,.82);
}
html[data-theme="light"] .avatar-sub{color:rgba(62,76,94,.6)}
html[data-theme="light"] .cert-img-placeholder{background:linear-gradient(135deg,#dfe4ea,#c8d2dd);color:rgba(62,76,94,.8)}
html[data-theme="light"] .hobby-cover,
html[data-theme="light"] .hobby-cover.ph1,
html[data-theme="light"] .hobby-cover.ph2,
html[data-theme="light"] .hobby-cover.ph3{
  background:linear-gradient(135deg,#e2e7ed 0%,#cbd4de 100%);
  color:rgba(62,76,94,.82);
}
html[data-theme="light"] .avatar-ring{
  box-shadow:0 12px 32px rgba(45,111,168,.20);
}

/* ---------- Hero（左头像 · 右内容，大气留白） ---------- */
.hero{padding:calc(var(--nav-h) + 64px) 0 60px}
.hero-grid{display:grid;grid-template-columns:248px 1fr;gap:54px;align-items:center;max-width:1000px;margin:0 auto}
.hero-text{text-align:left}
.hero-status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 26%,transparent);margin-bottom:20px}
.hero-status .dot{width:7px;height:7px;border-radius:50%;background:var(--hi);box-shadow:0 0 9px var(--hi);flex:none}
.hero-hello{font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:2px;margin-bottom:8px}
.hero h1{font-size:clamp(34px,5.4vw,52px);font-weight:900;line-height:1.12;letter-spacing:1px}
.hero h1 .nm{color:var(--text)}
.hero-sub{margin:12px 0 0;font-size:clamp(16px,2.4vw,21px);font-weight:800;letter-spacing:.5px;background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
/* 名字旁的座右铭：与名字同行的点睛短句 */
.hero-name-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:2px}
.hero-motto{position:relative;padding-left:15px;display:flex;flex-direction:column;gap:3px;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--text);line-height:1.35;white-space:nowrap}
.hero-motto span{display:block}
/* 座右铭：逐字波浪起伏，字符依序推进，配色随之流转变色 */
.hero-motto .m-ch{display:inline-block;will-change:transform;animation:mWave 2.9s ease-in-out infinite;animation-delay:calc(var(--i,0) * .14s)}
@keyframes mWave{
  0%,100%{transform:translateY(0);color:var(--text);text-shadow:0 0 0 transparent}
  25%{transform:translateY(-7px);color:var(--primary);text-shadow:0 8px 16px color-mix(in srgb,var(--primary) 42%,transparent)}
  75%{transform:translateY(3px);color:var(--accent);text-shadow:0 -3px 14px color-mix(in srgb,var(--accent) 38%,transparent)}
}
@media (prefers-reduced-motion:reduce){.hero-motto .m-ch{animation:none}}
.hero-motto::before{content:"";position:absolute;left:0;top:50%;width:3px;height:62%;transform:translateY(-50%);border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--accent));box-shadow:0 0 8px color-mix(in srgb,var(--accent) 50%,transparent))}
.hero-role{margin:16px 0 0;font-size:14px;color:var(--text-2);font-weight:600;line-height:1.7}
.hero-points{margin:18px 0 0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:11px 22px;max-width:640px}
.hero-points li{position:relative;padding-left:20px;font-size:13.5px;color:var(--text-2);line-height:1.65}
.hero-points li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--primary),var(--accent));transform:rotate(45deg)}
.hero-points b{color:var(--text);font-weight:700;margin-right:4px}
/* ---------- 技能关键词 · 通栏无缝匀速轮播带（独立一行，无横线分隔） ---------- */
.badge-band{
  margin-top:48px;padding:15px 0;
  background:color-mix(in srgb,var(--surface) 55%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  overflow:hidden;
}
.badge-track{display:flex;width:max-content;animation:badge-scroll 40s linear infinite}
.badge-group{display:flex;gap:10px;padding-right:10px;flex:none}
@keyframes badge-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.badge{
  padding:5px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;
  background:var(--primary-soft);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);
}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
/* 突出能力 · 金色高亮标注（比常规标签更醒目） */
.badge.star{
  background:var(--hi-soft);color:var(--hi);font-weight:700;
  border:1px solid color-mix(in srgb,var(--hi) 55%,transparent);
  box-shadow:0 0 10px color-mix(in srgb,var(--hi) 22%,transparent);
}
/* 白天模式：轮播带去掉白色底条，标签改为轻透明描边样式 */
html[data-theme="light"] .badge-band{
  background:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
html[data-theme="light"] .badge{
  background:transparent;
  border:1px solid color-mix(in srgb,var(--primary) 16%,transparent);
}
html[data-theme="light"] .badge.accent{
  background:transparent;
  border-color:color-mix(in srgb,var(--accent) 18%,transparent);
}
html[data-theme="light"] .badge.star{
  background:color-mix(in srgb,var(--hi-soft) 60%,transparent);
  border-color:color-mix(in srgb,var(--hi) 40%,transparent);
}

/* ---------- 鼠标星光（光标处大光晕 + 明显拖尾的小流星） ---------- */
.cursor-star{position:fixed;left:0;top:0;z-index:120;pointer-events:none;opacity:0;transition:opacity .35s}
.cursor-star.show{opacity:1}
.cs-glow{
  position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;
  background:radial-gradient(circle,var(--star-g2) 0%,transparent 68%);
  filter:blur(3px);will-change:transform;
}
.cs-dot{
  position:absolute;width:var(--s,5px);height:var(--s,5px);
  margin:calc(-0.5 * var(--s,5px)) 0 0 calc(-0.5 * var(--s,5px));
  border-radius:50%;background:var(--star-c);opacity:var(--o,1);
  box-shadow:0 0 8px 2px var(--star-g1),0 0 18px 6px var(--star-g2);
  will-change:transform;
}
.cs-head::before,.cs-head::after{
  content:"";position:absolute;left:50%;top:50%;width:46px;height:1.5px;
  margin:-0.75px 0 0 -23px;
  background:linear-gradient(90deg,transparent,var(--star-c) 50%,transparent);opacity:.75;
}
.cs-head::after{transform:rotate(90deg)}
/* 外层魔幻光晕：大范围彩雾（缓慢自转 + 呼吸）*/
.cs-aura-wrap{position:absolute;left:0;top:0;will-change:transform}
.cs-aura{
  position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  filter:blur(16px);opacity:.26;
  background:
    radial-gradient(circle at 32% 30%,color-mix(in srgb,var(--aura-1) 62%,transparent) 0%,transparent 46%),
    radial-gradient(circle at 69% 35%,color-mix(in srgb,var(--aura-2) 55%,transparent) 0%,transparent 44%),
    radial-gradient(circle at 46% 72%,color-mix(in srgb,var(--aura-3) 48%,transparent) 0%,transparent 48%),
    radial-gradient(circle at 50% 50%,rgba(255,236,196,.10) 0%,transparent 62%);
  animation:auraSpin 11s linear infinite,auraBreath 4.6s ease-in-out infinite;
}
/* 缓慢向外扩散的细光环，制造一圈圈荡开的涟漪 */
.cs-ring{
  position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--aura-1) 34%,transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--aura-1) 14%,transparent) inset,0 0 11px color-mix(in srgb,var(--aura-2) 11%,transparent);
  animation:auraRing 3.6s cubic-bezier(.22,.68,.34,1) infinite;
}
.cs-ring.r2{animation-delay:1.8s;transform-origin:50% 50%}
@keyframes auraSpin{to{transform:rotate(360deg)}}
@keyframes auraBreath{
  0%,100%{opacity:.20;filter:blur(17px) saturate(108%)}
  50%{opacity:.34;filter:blur(13px) saturate(146%)}
}
@keyframes auraRing{
  0%{transform:scale(.62);opacity:0}
  20%{opacity:.30}
  100%{transform:scale(1.22);opacity:0}
}
:root,html[data-theme="dark"]{--star-c:#ffffff;--star-g1:rgba(255,255,255,.9);--star-g2:rgba(178,214,255,.34);
  --aura-1:#8fd8ff;--aura-2:#c69cff;--aura-3:#ffbde4}
html[data-theme="light"]{--star-c:#3e4c5e;--star-g1:rgba(62,76,94,.55);--star-g2:rgba(45,111,168,.28);
  --aura-1:#5aa9e6;--aura-2:#9d86e8;--aura-3:#ef9ccc}
html[data-theme="light"] .cs-aura{opacity:.17;filter:blur(15px)}
html[data-theme="light"] .cs-ring{border-color:color-mix(in srgb,var(--aura-1) 26%,transparent)}
@media (pointer:coarse){.cursor-star{display:none}}
@media (prefers-reduced-motion:reduce){
  .cs-aura{animation:auraBreath 6s ease-in-out infinite}
  .cs-ring{display:none}
}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;justify-content:flex-start}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:12px;
  font-size:14px;font-weight:600;transition:all .2s;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,var(--primary-strong),var(--primary));color:#06121f;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 35%,transparent)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--primary) 45%,transparent)}
.btn-ghost{border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.hero-photo{display:flex;justify-content:center;align-items:center}
.avatar-ring{
  position:relative;
  width:220px;height:220px;border-radius:50%;padding:6px;background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 12px 32px color-mix(in srgb,var(--primary) 28%,transparent);
  animation:ringGlow 4.6s ease-in-out infinite;
}
/* 头像底光环：明显、较厚的柔光描边 */
.avatar-ring::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;padding:6px;pointer-events:none;
  background:linear-gradient(135deg,var(--primary),var(--accent) 55%,var(--primary));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  filter:blur(2px) drop-shadow(0 0 16px color-mix(in srgb,var(--accent) 70%,transparent));
  opacity:.92;
}
/* 星星轨道：一圈星星绕头像旋转、闪烁，并带切向拖尾 */
.avatar-orbit{position:absolute;inset:-2px;border-radius:50%;pointer-events:none;animation:orbitSpin 12s linear infinite}
.orbit-star{
  position:absolute;left:50%;top:50%;line-height:1;
  font-size:calc(var(--sz,12) * 1px);
  transform:rotate(calc(var(--a)*1deg)) translateY(calc(var(--r)* -1px));
  text-shadow:0 0 8px var(--accent),0 0 16px color-mix(in srgb,var(--accent) 50%,transparent);
  animation:starTwinkle var(--tw,1.8s) ease-in-out infinite;
  will-change:opacity,transform;
}
/* 拖尾：沿轨道切向、由星星向运动反方向淡出的发光尾迹 */
.orbit-star::before{
  content:"";position:absolute;top:50%;left:50%;width:30px;height:3px;
  transform:translate(-100%,-50%);
  background:linear-gradient(90deg,currentColor 0%,color-mix(in srgb,currentColor 55%,transparent) 55%,transparent 100%);
  opacity:.85;filter:blur(1px);border-radius:2px;
}
.orbit-star::after{
  content:"";position:absolute;top:50%;left:50%;width:58px;height:2px;
  transform:translate(-100%,-50%);
  background:linear-gradient(90deg,color-mix(in srgb,currentColor 42%,transparent) 0%,transparent 92%);
  opacity:.55;filter:blur(3px);border-radius:2px;
}
.orbit-star.bright{color:#eaf7ff;text-shadow:0 0 6px #fff,0 0 12px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 72%,#fff)}
.orbit-star.gold{color:var(--hi);text-shadow:0 0 6px var(--hi),0 0 14px color-mix(in srgb,var(--hi) 60%,transparent)}
.orbit-star.dim{color:var(--accent);opacity:.5;text-shadow:0 0 5px color-mix(in srgb,var(--accent) 45%,transparent)}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes starTwinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes ringGlow{0%,100%{filter:drop-shadow(0 0 4px var(--ring-glow))}50%{filter:drop-shadow(0 0 14px var(--ring-glow))}}
.avatar-inner{
  width:100%;height:100%;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;overflow:hidden;position:relative;
}
.avatar-inner img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.avatar-inner .avatar-placeholder{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#16233a 0%,#0d1526 100%);padding:8px}
/* 头像字标：无照片时呈现姓名缩写字标，看起来是刻意设计而非空位 */
.avatar-mono{
  font-size:56px;font-weight:900;letter-spacing:3px;line-height:1;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.avatar-sub{margin-top:10px;font-size:12px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,.55)}

/* ---------- 亮点成果 ---------- */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.hl-num{font-size:clamp(30px,4vw,40px);font-weight:900;background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.hl-label{margin-top:8px;font-weight:700;font-size:15px}
.hl-desc{margin-top:6px;font-size:13px;color:var(--text-2)}

/* ---------- 优势标注：真优势点出彩，非优势回到普通色 ---------- */
.hl-mark{
  color:var(--primary);font-weight:800;padding:0 2px;border-radius:3px;
  background:linear-gradient(180deg,transparent 58%,color-mix(in srgb,var(--primary) 26%,transparent) 58%);
}
html[data-theme="dark"] .hl-mark{
  color:var(--accent);
  background:linear-gradient(180deg,transparent 58%,color-mix(in srgb,var(--accent) 30%,transparent) 58%);
}
/* 非核心优势：保留加粗但用普通文字色，避免"处处是重点" */
.hl-num.plain{background:none;color:var(--text-2);font-weight:800}
.hl-star{
  display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.5px;vertical-align:middle;
  color:var(--hi);background:var(--hi-soft);border:1px solid color-mix(in srgb,var(--hi) 40%,transparent);
}
.skill-star{
  display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.5px;
  padding:1px 6px;border-radius:999px;vertical-align:middle;
  color:var(--hi);background:var(--hi-soft);border:1px solid color-mix(in srgb,var(--hi) 38%,transparent);
}

/* ---------- 经历（三模块直接展开） ---------- */
.exp-group{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:start;
}
.exp-group.nopic{grid-template-columns:minmax(0,1fr)}
.exp-group:last-child{margin-bottom:0}
.exp-group:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.exp-body{min-width:0}
/* 右侧配图：与证书同款封面式样，锁定 4:3 方框，全屏也不被拉伸压扁 */
.exp-cover{
  position:relative;width:200px;height:150px;border-radius:12px;overflow:hidden;display:block;cursor:zoom-in;
  border:2px solid color-mix(in srgb,var(--primary) 22%,var(--border));
  box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 18%,transparent);
  background:var(--surface-2);
}
.exp-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .32s ease}
.exp-cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 52%,rgba(0,0,0,.5));opacity:0;transition:opacity .25s;
}
.exp-cover:hover::after{opacity:1}
.exp-cover:hover .cert-zoom{opacity:1;transform:none}
.exp-cover:hover img{transform:scale(1.06)}
html[data-theme="light"] .exp-cover img{filter:saturate(.95) contrast(.98)}
.exp-group-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin-bottom:18px;color:var(--text)}
.exp-group-title::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.exp-item{position:relative;padding-left:28px;padding-bottom:26px;border-left:2px solid var(--border)}
.exp-item:last-child{padding-bottom:0}
.exp-item::before{
  content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:3px solid var(--primary);
}
.exp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.exp-title{font-size:17px;font-weight:700}
.exp-org{font-size:14px;color:var(--primary);font-weight:600}
.exp-time{margin-left:auto;font-size:13px;color:var(--text-2);background:var(--surface-2);padding:3px 12px;border-radius:999px;white-space:nowrap}
.exp-list{margin-top:12px;list-style:none;display:grid;gap:8px}
.exp-list li{position:relative;padding-left:18px;font-size:14px;color:var(--text-2)}
.exp-list li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:linear-gradient(135deg,var(--primary),var(--accent));transform:rotate(45deg)}

/* ---------- 项目卡片 ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (max-width:760px){.proj-grid{grid-template-columns:1fr}}
.proj-head{display:flex;align-items:flex-start;gap:12px}
.proj-icon{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));color:var(--primary)}
.proj-icon svg{width:22px;height:22px}
.proj-name{font-size:16px;font-weight:700}
.proj-meta{font-size:12.5px;color:var(--text-2);margin-top:2px}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tag{font-size:12px;padding:3px 10px;border-radius:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.proj-result{font-size:13.5px;color:var(--text-2)}
.proj-result strong{color:var(--accent);font-weight:700}
/* 项目卡片里的作品跳转按钮（如坦克大战试玩入口） */
.proj-link{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 16px;border-radius:10px;
  font-size:13px;font-weight:700;text-decoration:none;color:var(--primary);
  border:1px solid color-mix(in srgb,var(--primary) 38%,transparent);
  background:color-mix(in srgb,var(--primary) 10%,transparent);
  transition:all .2s;
}
.proj-link svg{width:15px;height:15px}
.proj-link:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--primary) 20%,transparent);box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 26%,transparent)}

/* ---------- 技能矩阵（一排四列） ---------- */
.skill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.skill-cat{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.skill-cat svg{width:20px;height:20px;color:var(--primary)}
.skill-cat h3{font-size:16px;font-weight:700}
.skill-row{margin-bottom:14px}
.skill-row:last-child{margin-bottom:0}
.skill-info{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.skill-info b{font-weight:600}
.skill-info span{color:var(--text-2);font-size:12.5px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .9s cubic-bezier(.22,1,.36,1)}

/* ---------- 突出能力 · 金色高亮框架（技能矩阵 / 证书 / 分数章通用） ---------- */
.skill-row.hl{
  position:relative;padding:10px 12px 12px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--hi) 50%,transparent);
  background:linear-gradient(135deg,var(--hi-soft),transparent 75%);
  box-shadow:0 0 14px color-mix(in srgb,var(--hi) 16%,transparent);
}
.skill-row.hl .bar i{background:var(--hi-grad)}
.hi-tag{
  display:inline-block;margin-left:8px;padding:0 9px;border-radius:999px;font-style:normal;
  font-size:11px;font-weight:700;letter-spacing:1px;vertical-align:1.5px;
  color:var(--hi);border:1px solid color-mix(in srgb,var(--hi) 50%,transparent);background:var(--hi-soft);
}
.cert-item.hi{
  border-color:color-mix(in srgb,var(--hi) 50%,transparent);
  background:linear-gradient(135deg,var(--hi-soft),var(--surface-2));
  box-shadow:0 0 16px color-mix(in srgb,var(--hi) 16%,transparent);
}
.cert-item.hi .cert-meta{color:var(--hi)}
.cert-item.hi .cert-img,.cert-item.hi .cert-img-placeholder{
  border-color:color-mix(in srgb,var(--hi) 45%,var(--border));
}
.score-chip{
  display:inline-block;margin:0 3px;padding:0 10px;border-radius:999px;
  font-weight:800;font-size:12.5px;color:var(--hi);
  border:1px solid color-mix(in srgb,var(--hi) 50%,transparent);background:var(--hi-soft);
}

/* ---------- 教育与证书（两栏 + 自动标题） ---------- */
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.edu-col-title{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px;color:var(--text)}
.edu-col-title::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.edu-school{font-size:18px;font-weight:800}
.edu-school-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:2px}
.edu-motto{font-size:14px;font-weight:700;letter-spacing:4px;color:var(--accent);white-space:nowrap}
.edu-motto::before{content:"校训";font-size:11px;font-weight:600;letter-spacing:1px;color:var(--text-2);margin-right:10px;border:1px solid var(--border);border-radius:4px;padding:2px 5px}
.edu-major{color:var(--primary);font-weight:600;font-size:14px;margin-top:4px}
.edu-time{font-size:13px;color:var(--text-2);margin-top:4px}
.edu-detail{margin-top:16px;font-size:13.5px;color:var(--text-2);display:grid;gap:14px}
.edu-detail .edu-block b{color:var(--text)}
.edu-list{margin:6px 0 0;padding-left:18px;display:grid;gap:6px}
.edu-list li{font-size:13.5px;color:var(--text-2)}
.course-flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cert-item{
  display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center;
  padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);
  margin-bottom:14px;transition:transform .2s,box-shadow .2s;
}
.cert-item:last-child{margin-bottom:0}
.cert-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.cert-img{
  width:160px;height:120px;object-fit:cover;border-radius:10px;
  border:2px solid color-mix(in srgb,var(--primary) 22%,var(--border));
  box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 18%,transparent);
  background:linear-gradient(135deg,#16233a,#0d1526);display:block;
}
/* 证书封面：可点击查看大图 */
.cert-cover{position:relative;width:160px;height:120px;border-radius:10px;overflow:hidden;cursor:zoom-in;display:block}
.cert-cover .cert-img{width:100%;height:100%;margin:0;border:none;box-shadow:none;border-radius:0;transition:transform .32s ease}
.cert-cover::after{
  content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:linear-gradient(180deg,transparent 52%,rgba(0,0,0,.5));
  opacity:0;transition:opacity .25s;
}
.cert-zoom{
  position:absolute;right:8px;bottom:8px;z-index:2;
  width:25px;height:25px;border-radius:8px;display:grid;place-items:center;
  background:rgba(8,18,34,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.3);color:#fff;
  opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s;
}
.cert-zoom svg{width:13px;height:13px}
.cert-cover:hover::after{opacity:1}
.cert-cover:hover .cert-zoom{opacity:1;transform:none}
.cert-cover:hover .cert-img{transform:scale(1.06)}
.cert-img-placeholder{
  width:160px;height:120px;border-radius:10px;
  background:linear-gradient(135deg,#16233a 0%,#0d1526 100%);
  display:grid;place-items:center;gap:6px;
  font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);
  letter-spacing:1px;text-align:center;line-height:1.4;padding:10px;
  border:2px solid color-mix(in srgb,var(--primary) 22%,var(--border));
  box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 18%,transparent);
  grid-template-rows:auto auto;
}
.cert-img-placeholder svg{width:34px;height:34px;color:var(--primary)}
/* 高含金量证书封面徽章（金色） */
.cert-item.hi .cert-img-placeholder svg{color:var(--hi)}
.cert-name{font-weight:800;font-size:15px;color:var(--text)}
.cert-meta{font-size:12.5px;color:var(--accent);font-weight:700;margin:4px 0}
.cert-desc{font-size:13px;color:var(--text-2);line-height:1.6}

/* ---------- 兴趣爱好 ---------- */
.hobby-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.hobby-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.hobby-cover{
  width:100%;height:180px;display:grid;place-items:center;gap:10px;flex:none;
  background:linear-gradient(135deg,#101a2c 0%,#1b2a40 100%);
  color:rgba(255,255,255,.9);font-size:13px;font-weight:700;letter-spacing:1.5px;
  border-bottom:1px solid var(--border);position:relative;
  grid-template-rows:auto auto;grid-auto-flow:row;
}
/* 爱好封面：主题图标 + 名称，风格化呈现（放入 h.img 即自动换成真实图片） */
.hobby-cover svg{width:44px;height:44px;opacity:.92}
.hobby-cover.ph1{background:linear-gradient(135deg,#16233a 0%,#1f3047 100%);color:rgba(255,255,255,.9)}
.hobby-cover.ph2{background:linear-gradient(135deg,#101a2c 0%,#243650 100%);color:rgba(255,255,255,.9)}
.hobby-cover.ph3{background:linear-gradient(135deg,#1b2a40 0%,#0d1526 100%);color:rgba(255,255,255,.9)}
/* 带图封面：图片作横幅，标题叠在其上（暗角渐变保证文字清晰），不遮挡正文 */
.hobby-cover.has-img{position:relative;display:block;padding:0}
.hobby-cover.has-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.hobby-card:nth-child(1) .hobby-cover.has-img img{object-position:50% 42%}   /* 摄影：建筑风光，略偏上保留天空 */
.hobby-card:nth-child(2) .hobby-cover.has-img img{object-position:50% 28%}   /* 财经：九宫格知识图，露顶部标题 */
.hobby-card:nth-child(3) .hobby-cover.has-img img{object-position:50% 15%}   /* 音乐：酷狗资料页，露标题与信息 */
.hobby-cover.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,12,26,.86) 0%,rgba(6,12,26,.10) 56%,rgba(6,12,26,.34) 100%)}
.hobby-cover.has-img .hobby-art{display:none}
.hobby-cover.has-img span{position:absolute;left:0;right:0;bottom:0;z-index:2;margin:0;padding:0 16px 13px;text-align:left;font-size:15px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.65)}
/* 摄影作品：轮播放在封面位置（与财经/音乐横幅同高、同位置） */
.hobby-cover.has-carousel{height:180px;display:block;padding:0}
.hobby-cover.has-carousel .photo-carousel{height:180px;border-radius:0;border:none;box-shadow:none}
.hobby-cover.has-carousel .carousel-viewport{aspect-ratio:auto;height:100%}
.hobby-body{padding:22px 24px}

  display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);
  transition:background .2s,border-color .2s;z-index:2;font-size:22px;line-height:1;
}
.carousel-btn:hover{background:rgba(0,0,0,.68);border-color:rgba(255,255,255,.45)}
.carousel-prev{left:14px}
.carousel-next{right:14px}

      });

      h.gallery.forEach(() => dots.appendChild(el("button", "carousel-dot")));
      carousel.append(viewport, prevBtn, nextBtn, dots);

    c.appendChild(body);
    grid.appendChild(c);

    // 摄影轮播逻辑
    if (h.gallery && h.gallery.length) {
      const trackEl = cover.querySelector(".carousel-track");
      const dotEls = cover.querySelectorAll(".carousel-dot");
      const slides = trackEl.children;
      let idx = 0;
      function go(to) {
        idx = (to + slides.length) % slides.length;
        trackEl.style.transform = "translateX(-" + (idx * 100) + "%)";
        Array.from(dotEls).forEach((d, i) => d.classList.toggle("active", i === idx));
      }
      prevBtn.addEventListener("click", e => { e.stopPropagation(); go(idx - 1); resetAuto(); });
      nextBtn.addEventListener("click", e => { e.stopPropagation(); go(idx + 1); resetAuto(); });
      Array.from(dotEls).forEach((d, i) => d.addEventListener("click", e => { e.stopPropagation(); go(i); resetAuto(); }));
      let auto = setInterval(() => go(idx + 1), 4500);
      function resetAuto() { clearInterval(auto); auto = setInterval(() => go(idx + 1), 4500); }
      carousel.addEventListener("mouseenter", () => clearInterval(auto));
      carousel.addEventListener("mouseleave", () => { clearInterval(auto); auto = setInterval(() => go(idx + 1), 4500); });
      document.addEventListener("keydown", e => {
        if (!lightbox.classList.contains("show")) {
          if (e.key === "ArrowLeft") { go(idx - 1); resetAuto(); }
          if (e.key === "ArrowRight") { go(idx + 1); resetAuto(); }
        }
      });
      go(0);
    }
  });
})();

    nodes[0].x += (tx - nodes[0].x) * .34;
    nodes[0].y += (ty - nodes[0].y) * .34;
    for (let i = 1; i < nodes.length; i++) {
      // 越靠尾部跟随越慢，移动时尾巴自然拉长、拖拽感明显
      const f = .30 - i * .022;
      nodes[i].x += (nodes[i - 1].x - nodes[i].x) * f;
      nodes[i].y += (nodes[i - 1].y - nodes[i].y) * f;
    }
    // 外晕跟随略慢于星光，只留一点点滞留感，避免拖得太远显得笨重
    ax += (nodes[0].x - ax) * .27;
    ay += (nodes[0].y - ay) * .27;
    auraWrap.style.transform = `translate3d(${ax}px,${ay}px,0)`;
    glow.style.transform = `translate3d(${nodes[0].x}px,${nodes[0].y}px,0)`;
    nodes.forEach(n => { n.node.style.transform = `translate3d(${n.x}px,${n.y}px,0)`; });
    requestAnimationFrame(tick);
  })();
})();

/* ================= 流星背景（深色主题） ================= */
(function createMeteorSky() {
  const container = $("#meteorBg");
  if (!container) return;
  const count = 42;          // 流星数量，简历页建议 35–55
  const baseDuration = 6.0;  // 基础下落时间（秒），越大越慢
  const durationRange = 4.0; // 随机变化范围

  for (let i = 0; i < count; i++) {
    const meteor = document.createElement("div");
    const visual = document.createElement("div");
    const tail   = document.createElement("div");
    const head   = document.createElement("div");

    meteor.className = "meteor";
    visual.className = "visual";
    tail.className   = "tail";
    head.className   = "head";
    visual.appendChild(tail);
    visual.appendChild(head);
    meteor.appendChild(visual);

    const startX      = (Math.random() * 100) + "vw";
    const len         = 12 + Math.random() * 55;
    const thickness   = 0.8 + Math.random() * 1.6;
    const headSize    = 1.2 + Math.random() * 1.8;
    const angle       = (Math.random() * 4 - 2) + "deg";
    const duration    = baseDuration + Math.random() * durationRange;
    const delay       = Math.random() * (baseDuration + durationRange);
    const peakOpacity = 0.35 + Math.random() * 0.65;

    meteor.style.setProperty("--start-x", startX);
    meteor.style.setProperty("--len", `${len}px`);
    meteor.style.setProperty("--thickness", `${thickness}px`);
    meteor.style.setProperty("--head-size", `${headSize}px`);
    meteor.style.setProperty("--angle", angle);
    meteor.style.setProperty("--duration", `${duration.toFixed(2)}s`);
    meteor.style.setProperty("--delay", `-${delay.toFixed(2)}s`);
    meteor.style.setProperty("--peak-opacity", peakOpacity.toFixed(2));

    container.appendChild(meteor);
  }
})();
</script>
<script>
(function(){
  var intro = document.getElementById('intro');
  var skipBtn = document.getElementById('introSkip');
  if(!intro) return;
  var html = document.documentElement;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rafId = null, timer = null;
  if(reduce){ intro.style.display='none'; html.classList.remove('intro-on'); return; }

  var cv = document.getElementById('introCanvas');
  var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
  // 拿不到 2D 上下文就整段跳过开场，宁可不播动画也绝不让遮罩把页面挡黑
  if(!ctx){ intro.style.display='none'; html.classList.remove('intro-on'); return; }
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var particles = [], stars = [];
  var phase = 'idle';
  var start = null, landStart = null;
  var ASSEMBLE = 1750, HOLD = 1400, LAND = 1000;
  var TOTAL = ASSEMBLE + HOLD + 600;   // 拼完停顿一下再“落”到页面名字
  var landData = null;
  var slogan = document.querySelector('.intro-slogan');

  /* 手写体探测：优先行楷/楷体这类带书写感的字体，全部缺失则回退系统黑体。
     顺带返回采样密度——手写体笔画更细更飘，需要更密的采样才不会断线。 */
  function pickHandFont(){
    // canvas 不可用时直接走回退，绝不让字体探测把开场动画整个带崩
    var fallback = { fam: '"Microsoft YaHei","PingFang SC","Noto Sans SC","Heiti SC",sans-serif', div: 18, thr: 85, hand: false };
    var probeCv = document.createElement('canvas');
    if(!probeCv.getContext) return fallback;
    var probe = null;
    try { probe = probeCv.getContext('2d'); } catch(e) { probe = null; }
    if(!probe || !probe.measureText) return fallback;
    var text = '刁雅琪';
    // div 越大 → 采样网格越小 → 笔画越连续。手写体笔画纤细，网格一稀就会漏采竖笔导致缺画。
    var cands = [
      { fam: '"STXingkai","华文行楷"',   div: 24, thr: 70 },
      { fam: '"STKaiti","华文楷体"',      div: 26, thr: 70 },
      { fam: '"KaiTi","楷体","Kaiti SC"', div: 26, thr: 70 },
      { fam: '"FZShuTi","方正舒体"',      div: 26, thr: 72 },
      { fam: '"LiSu","隶书"',             div: 22, thr: 78 }
    ];
    function widthOf(f){
      probe.font = '400 100px ' + f;
      return probe.measureText(text).width;
    }
    var base = widthOf('monospace');
    for(var i = 0; i < cands.length; i++){
      probe.font = '400 100px ' + cands[i].fam + ',monospace';
      if(Math.abs(probe.measureText(text).width - base) > 0.5){
        return { fam: cands[i].fam + ',"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif', div: cands[i].div, thr: cands[i].thr, hand: true };
      }
    }
    return fallback;
  }

  function dotColor(t){
    var stops = [
      {p:0.0, r:255,g:255,b:255},
      {p:0.35, r:176,g:240,b:255},
      {p:0.7, r:120,g:205,b:255},
      {p:1.0, r:104,g:170,b:255}
    ];
    var s1 = stops[0], s2 = stops[stops.length-1];
    for(var i=0;i<stops.length-1;i++){
      if(t >= stops[i].p && t <= stops[i+1].p){ s1=stops[i]; s2=stops[i+1]; break; }
    }
    var range = s2.p - s1.p;
    var k = range ? (t - s1.p) / range : 0;
    return 'rgb(' + Math.round(s1.r+(s2.r-s1.r)*k) + ',' + Math.round(s1.g+(s2.g-s1.g)*k) + ',' + Math.round(s1.b+(s2.b-s1.b)*k) + ')';
  }

  function build(){
    var rect = cv.getBoundingClientRect();
    W = rect.width; H = rect.height;
    if(!W) return;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var off = document.createElement('canvas');
    var sampleScale = 2;
    off.width = Math.round(W * sampleScale);
    off.height = Math.round(H * sampleScale);
    var oc = off.getContext('2d');
    if(!oc) return;
    var F = pickHandFont();
    var fontPx = Math.min(H * 0.76, W / 3.4);
    // 手写体用常规字重：合成粗体会把笔画的提按变化抹平，反而失去手写味
    oc.font = '400 ' + (fontPx * sampleScale) + 'px ' + F.fam;
    oc.textAlign = 'center'; oc.textBaseline = 'middle';
    oc.fillStyle = '#fff';
    oc.fillText('刁雅琪', off.width / 2, off.height / 2);

    var data = oc.getImageData(0, 0, off.width, off.height).data;
    var gridCSS = Math.max(3, Math.round(fontPx / F.div));  // 手写笔画更细 → 采样更密，保证连笔不断
    var grid = gridCSS * sampleScale;

    // 用文字实际占宽切三个字块，比按整块宽度三等分更准（行楷字距本就不均）
    var mw = oc.measureText('刁雅琪').width;
    var x0 = off.width / 2 - mw / 2, cw = mw / 3;

    function alphaAt(px, py){
      if(px < 0 || py < 0 || px >= off.width || py >= off.height) return 0;
      return data[(py * off.width + px) * 4 + 3];
    }

    var raw = [];
    for(var y = 0; y < off.height; y += grid){
      for(var x = 0; x < off.width; x += grid){
        if(alphaAt(x, y) > F.thr){
          // 邻域命中数：笔画中心的点更"实"、边缘的点更"虚" → 手写提按的粗细感
          var n = 0;
          if(alphaAt(x - grid, y) > F.thr) n++;
          if(alphaAt(x + grid, y) > F.thr) n++;
          if(alphaAt(x, y - grid) > F.thr) n++;
          if(alphaAt(x, y + grid) > F.thr) n++;
          raw.push({ x: x / sampleScale, y: y / sampleScale, t: x / off.width, n: n });
        }
      }
    }
    if(!raw.length) return;

    // 书写笔顺：先写完第一个字再写下一个（字块 → 从上到下分行 → 行内从左到右）。
    // 粒子按这个次序依次落位，看上去就是一笔一划把名字"描"出来，而不是整片同时浮现。
    var band = Math.max(5, fontPx * 0.05);
    raw.sort(function(a, b){
      var ca = Math.max(0, Math.min(2, Math.floor((a.x * sampleScale - x0) / cw)));
      var cb = Math.max(0, Math.min(2, Math.floor((b.x * sampleScale - x0) / cw)));
      if(ca !== cb) return ca - cb;
      var ra = Math.round(a.y / band), rb = Math.round(b.y / band);
      if(ra !== rb) return ra - rb;
      return a.x - b.x;
    });

    // 密度保险：窄屏或大字号下点数可能破千，沿书写顺序等距抽稀，
    // 既把每帧绘制量压在流畅区间，又完整保留笔顺与字形轮廓
    var MAX_PTS = 700;
    if(raw.length > MAX_PTS){
      var stride = raw.length / MAX_PTS;
      var thin = [];
      for(var ti = 0; ti < MAX_PTS; ti++) thin.push(raw[Math.floor(ti * stride)]);
      raw = thin;
    }

    // 每个亮点从目标附近的"星尘"里轻轻汇聚，半径更小 → 凝聚更紧、更像星尘凝成名字
    particles = raw.map(function(p, i){
      var ang = Math.random() * Math.PI * 2;
      var r = 3 + Math.random() * 12;
      var thick = 0.80 + 0.11 * p.n;                    // 笔锋：中心粗、边缘细
      var jitter = 1 + (Math.random() - 0.5) * 0.03;    // 落笔时间微微抖动，边缘带点墨迹毛感
      return {
        tx: p.x, ty: p.y,
        sx: p.x + Math.cos(ang) * r,
        sy: p.y + Math.sin(ang) * r,
        color: dotColor(p.t),
        delay: (i / raw.length) * ASSEMBLE * 0.92 * jitter,
        size: (1.75 + Math.random() * 0.85) * thick,
        tw: Math.random() * Math.PI * 2
      };
    });

    stars = [];
    for(var i = 0; i < 84; i++){
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        size: 0.5 + Math.random() * 1.1,
        speed: 0.1 + Math.random() * 0.26,
        tw: Math.random() * Math.PI * 2,
        opacity: 0.16 + Math.random() * 0.4
      });
    }
  }

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  function frame(t){
    if(!start) start = t;
    var el = t - start;
    ctx.clearRect(0, 0, W, H);

    // 背景星尘（与正文流星同语言，前摇与网页一脉相承）
    for(var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.y += s.speed;
      if(s.y > H + 8){ s.y = -8; s.x = Math.random() * W; }
      var a = s.opacity * (0.8 + 0.2 * Math.sin(t / 820 + s.tw));
      ctx.globalAlpha = Math.min(0.82, a);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    if(phase === 'idle' || phase === 'assemble' || phase === 'hold'){
      var p = Math.min(1, el / ASSEMBLE);
      var reachedAll = p >= 1;
      ctx.globalCompositeOperation = 'lighter';
      var nibX = -1, nibY = -1;   // 笔尖：跟着当前正在落下的那一笔走
      for(var i = 0; i < particles.length; i++){
        var pt = particles[i];
        var pe = el - pt.delay;
        if(pe < 0) continue;
        var k = pe < 520 ? easeInOutCubic(pe / 520) : 1;   // 柔和进出
        var arc = Math.sin(k * Math.PI) * 9;                // 轻微弧线，避免直线生硬
        var x = pt.sx + (pt.tx - pt.sx) * k;
        var y = pt.sy + (pt.ty - pt.sy) * k - arc;
        var baseA = pe < 520 ? (0.5 + 0.5 * (1 - k)) : 1;  // 汇聚途中更亮
        var breath = 0.9 + 0.1 * Math.sin(t / 520 + pt.tw);
        var a2 = Math.min(1, baseA * breath);
        ctx.globalAlpha = a2 * 0.58;                         // 更亮的柔光晕，让名字笔画更连续、更明显
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(x, y, pt.size * 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = a2;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        if(pe < 560){ nibX = x; nibY = y; }
      }
      // 笔尖光晕：一支看不见的笔正写到哪儿，就让哪儿亮一下
      if(nibX >= 0 && el < ASSEMBLE * 1.05){
        var nibR = 17;
        var ng = ctx.createRadialGradient(nibX, nibY, 0, nibX, nibY, nibR);
        ng.addColorStop(0, 'rgba(255,255,255,.95)');
        ng.addColorStop(0.3, 'rgba(200,245,255,.55)');
        ng.addColorStop(1, 'rgba(150,210,255,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = ng;
        ctx.beginPath();
        ctx.arc(nibX, nibY, nibR, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      if(reachedAll && phase === 'assemble') phase = 'hold';
    } else if(phase === 'land'){
      // 名字拼成后，整片星场带着名字轻轻“落”到页面正文里的名字上
      var le = t - landStart;
      var lp = Math.min(1, le / LAND);
      var e = easeInOutCubic(lp);
      var sc = 1 + (landData.scale - 1) * e;
      cv.style.transform = 'translate(' + (landData.dx * e) + 'px,' + (landData.dy * e) + 'px) scale(' + sc + ')';
      if(lp > 0.45) intro.style.opacity = String(Math.max(0, 1 - (lp - 0.45) / 0.55));
      var fade = lp > 0.6 ? Math.max(0, 1 - (lp - 0.6) / 0.4) : 1;
      ctx.globalCompositeOperation = 'lighter';
      for(var i = 0; i < particles.length; i++){
        var pt = particles[i];
        var a2 = (0.9 + 0.1 * Math.sin(t / 520 + pt.tw)) * fade;
        ctx.globalAlpha = a2 * 0.58;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.tx, pt.ty, pt.size * 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = a2;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(pt.tx, pt.ty, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      if(lp >= 1){
        if(landData.target) landData.target.classList.add('name-land');  // 页面名字辉光脉冲
        intro.classList.add('done');
        phase = 'done';
        cleanup();
        return;
      }
    }

    rafId = requestAnimationFrame(frame);
  }

  function cleanup(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if(timer){ clearTimeout(timer); timer = null; }
    window.removeEventListener('wheel', end);
    window.removeEventListener('keydown', end);
    window.removeEventListener('touchstart', onTouch, { passive: true });
    if(skipBtn) skipBtn.removeEventListener('click', onSkip);
  }

  function land(){
    if(phase === 'land' || phase === 'done') return;
    phase = 'land';
    landStart = performance.now();
    if(timer){ clearTimeout(timer); timer = null; }
    if(slogan){ slogan.style.transition = 'opacity .45s ease'; slogan.style.opacity = '0'; }
    // 对准页面正文里的名字（Hero 的 .nm；找不到才退回导航 .nav-name）
    var target = document.querySelector('#top .nm') || document.querySelector('.nav-name');
    var tr = target ? target.getBoundingClientRect() : null;
    var cr = cv.getBoundingClientRect();
    var curCx = cr.left + cr.width / 2, curCy = cr.top + cr.height / 2;
    var dx, dy, scale;
    if(tr){
      dx = (tr.left + tr.width / 2) - curCx;
      dy = (tr.top + tr.height / 2) - curCy;
      var nameH = cr.height * 0.6;                       // canvas 内名字约占画布高度比例
      scale = Math.max(0.42, Math.min(0.6, tr.height / nameH));
    } else { dx = 0; dy = -40; scale = 0.55; }
    landData = { dx: dx, dy: dy, scale: scale, target: target };
    cv.style.transformOrigin = 'center center';
    intro.style.transition = 'none';
    html.classList.remove('intro-on');                    // 同时让导航/正文渐显，名字“落”到页面
  }

  function end(){
    if(phase === 'land' || phase === 'done') return;
    land();
  }

  function onSkip(e){ if(e) e.stopPropagation(); end(); }
  function onTouch(e){
    if(skipBtn && skipBtn.contains(e.target)) return;
    end();
  }

  build();
  if(W){
    phase = 'assemble';
    rafId = requestAnimationFrame(frame);
  } else {
    end();
  }

  timer = setTimeout(end, TOTAL);

  if(skipBtn) skipBtn.addEventListener('click', onSkip);
  window.addEventListener('wheel', end, { passive: true });
  window.addEventListener('keydown', end);
  window.addEventListener('touchstart', onTouch, { passive: true });
})();
</script>
